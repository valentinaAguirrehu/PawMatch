name: paw_match
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.2.3
  font_awesome_flutter: ^11.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  web: ^1.1.1
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  table_calendar: ^3.1.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  camera: ^0.11.0
  image_picker_platform_interface: ^2.11.2
  camera_windows: ^0.3.0+1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  audioplayers: ^6.5.1
  record: ^5.2.1
  path_provider: ^2.1.5
  path: ^1.9.1

dependency_overrides:
  image: 4.10.0
  record_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/Logo Fundación.png
    - assets/images/denuncias_hero.jpg
    - assets/images/inicio/
    - assets/images/inicio/fundacion_hero.jpg
    - assets/images/inicio/familia.jpg
    - assets/images/inicio/juntos.jpg
    - assets/fundacion/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
